name: Crypto Bot 24/7

# A run trades in a loop (a pass every 5 minutes for ~5h40m) and then starts the next run itself.
# The schedule below is only a backup in case a hand-over is ever lost.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: crypto-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Trading loop
        run: bash crypto-bot/server/loop.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KRAKEN_DEMO_KEY: ${{ secrets.KRAKEN_DEMO_KEY }}
          KRAKEN_DEMO_SECRET: ${{ secrets.KRAKEN_DEMO_SECRET }}
          CB_INTERVAL: ${{ vars.CB_INTERVAL || '300' }}
          CB_LOOP_MINUTES: ${{ vars.CB_LOOP_MINUTES || '340' }}
